<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tugas4.1</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      background-color: #ffffff;
    }

    .container {
      display: grid;
      width: 748px;
      height: 748px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
      gap: 9px;
      background-color: #000000;
    }

    .white {
      background-color: #f0f1ec;
    }

    .red {
      background-color: #e72f24;
    }

    .blue {
      background-color: #004592;
    }

    .yellow {
      background-color: #f9d01e;
    }

    .black {
      background-color: #232629;
    }

    .red {
      grid-column: 1;
      grid-row: 1;
    }

    .white-top {
      grid-column: 2 / 5;
      grid-row: 1;
    }

    .white-left {
      grid-column: 1;
      grid-row: 2;
    }

    .white-center {
      grid-column: 2 / 4;
      grid-row: 2;
    }

    .blue {
      grid-column: 4;
      grid-row: 2;
    }

    .white-lower-left {
      grid-column: 1;
      grid-row: 3 / 5;
    }

    .white-lower-center {
      grid-column: 2 / 4;
      grid-row: 3;
    }

    .white-tall {
      grid-column: 4;
      grid-row: 3 / 5;
    }

    .yellow {
      grid-column: 2;
      grid-row: 4;
    }

    .black {
      grid-column: 3;
      grid-row: 4;
    }
  </style>
</head>

<body>
  <main class="container" aria-label="Mondrian composition">
    <div class="red"></div>
    <div class="white white-top"></div>
    <div class="white white-left"></div>
    <div class="white white-center"></div>
    <div class="blue"></div>
    <div class="white white-lower-left"></div>
    <div class="white white-lower-center"></div>
    <div class="white white-tall"></div>
    <div class="yellow"></div>
    <div class="black"></div>
  </main>
</body>

</html>
